<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToDo List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  
  <body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 text-gray-900 flex flex-col">

    <header class="flex-none border-b bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-sm">
      <div class="px-4 py-4">
        <h1 class="text-2xl font-bold">ToDo List</h1>
        <p class="text-sm text-blue-100 mt-1">Organize your tasks and boost productivity</p>
      </div>
    </header>
    <div class="flex-1 flex overflow-hidden min-h-0">

      <nav id="app" class="w-80 shrink-0 border-r bg-white p-4 overflow-y-auto shadow-sm">
        <h2 class="text-lg font-medium mb-4">Controls</h2>
        

        <div class="mb-4 p-3 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg text-sm border border-blue-100 font-medium">
          Total: <span id="stat-total" class="font-bold text-blue-600">0</span> | 
          Open: <span id="stat-open" class="font-bold text-orange-600">0</span> | 
          Done: <span id="stat-done" class="font-bold text-green-600">0</span>
        </div>

        <div class="flex flex-col gap-2 mb-4">
          <button class="filter-btn active px-3 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg transition-all hover:bg-blue-700 shadow-sm" data-filter="all">All</button>
          <button class="filter-btn px-3 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg transition-all hover:bg-blue-700 shadow-sm" data-filter="open">Open</button>
          <button class="filter-btn px-3 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg transition-all hover:bg-blue-700 shadow-sm" data-filter="done">Done</button>
          <button id="clear-btn" class="px-3 py-2 text-sm font-medium bg-red-500 text-white rounded-lg transition-all hover:bg-red-600 shadow-sm">Clear Completed</button>
        </div>

        <div class="mb-4">
          <input type="text" id="search-input" placeholder="Search..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        </div>

        <div id="error-box" class="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm border border-red-200" style="display: none;"></div>
        <div class="mt-4 flex flex-col gap-2">
          <input type="text" id="add-input" placeholder="New task..." class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
          <button id="add-submit" class="w-full px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-lg hover:from-blue-700 hover:to-indigo-700 text-sm font-medium transition-all shadow-sm">Add Task</button>
        </div>
      </nav>
      
      <main class="bg-gradient-to-br from-blue-50 to-indigo-50 w-full min-h-20 p-6 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Tasks</h2>
        <ul id="todo-list" class="space-y-2">

        </ul>
      </main>
    </div>

    <script src="logic.js"></script>
  </body>
</html>
